<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="40x40" href="/images/favicon.png">
  <title>Add Produce | KGL</title>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <!-- BootStrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css">
  <!-- MDB -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/4.1.0/mdb.min.css" rel="stylesheet">
  <!-- Personal CSS -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Main Navigation -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
      <div class="container">
        <a class="navbar-brand mt-2 mt-lg-0" href="">
          <img src="/images/KGLogo.svg" alt="KGL Logo" loading="lazy" height="20">
        </a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/manager">Dashboard</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
          <a class="dropdown-item" href="/logout">Logout</a>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div class="container-lg">
      <!-- Flash messages (success_msg / error_msg / errors) render here when present -->
      <div class="row">
        <h3 class="text-center">Add Procurement Details</h3>
        <div class="card p-3">
          <form name="produce" action="/manager/produce/new" method="POST">
            <div id="pdt-name" class="col-12 mb-2">
              <div class="form-floating">
                <input class="form-control" type="text" name="prodname" onblur="pdtVal()" placeholder="" required>
                <label class="form-label" for="prodname">Name of Produce</label>
              </div>
            </div>
            <div class="row">
              <div id="pd-type" class="col-12 col-md-6 mb-2">
                <div>
                  <label class="form-label" for="prodtype">Type of Produce</label>
                  <select class="form-select" name="prodtype" onblur="typeVal()" required>
                    <option value="" selected>Select Type</option>
                    <option value="cereal">Cereal</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>
              <div id="pd-time" class="col-12 col-md-6 mb-2">
                <div>
                  <label class="form-label" for="prodtime">Time of Produce (Quarters)</label>
                  <select class="form-select" onblur="timeVal()" name="prodtime">
                    <option value="" selected>Select option</option>
                    <option value="Q1">Quarter 1</option>
                    <option value="Q2">Quarter 2</option>
                    <option value="Q3">Quarter 3</option>
                    <option value="Q4">Quarter 4</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="row">
              <div id="dlr-name" class="col col-md-6 mb-2">
                <div class="form-floating">
                  <input class="form-control" type="text" name="dlrname" placeholder="" required onblur="dlrVal(2)">
                  <label for="dlrname">Name of Dealer</label>
                </div>
              </div>
              <div id="dlr-type" class="col-12 col-md-6 mb-2">
                <div>
                  <label for="dlrtype">Type of Dealer</label>
                  <select class="form-select" onblur="dlrTypeVal()" name="dlrtype">
                    <option value="" selected>Choose option</option>
                    <option value="Individual">Individual</option>
                    <option value="Farm">Farm</option>
                    <option value="Company">Company</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="row">
              <div id="ton-field" class="col-12 col-md-6 mb-2">
                <div class="form-floating">
                  <input class="form-control" type="number" min="100" name="tonnage" required placeholder="" onblur="tonVal()">
                  <label class="form-label" for="tonnage">Tonnage (Kgs)</label>
                </div>
              </div>
              <div class="col-12 col-md-6 mb-2">
                <div class="form-floating">
                  <input class="form-control" type="number" min="10000" name="buyprice" placeholder="" required>
                  <label class="form-label" for="buyprice">Bought at (Ugx)</label>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col col-md-6 mb-2">
                <div class="form-floating">
                  <input class="form-control" type="text" name="brname" placeholder="" value="Mattuga" required readonly>
                  <label class="form-label" for="brname">Branch</label>
                </div>
              </div>
              <div class="col-12 col-md-6 mb-2">
                <div>
                  <label for="procdate">Date of Procurement</label>
                  <input class="form-control" type="text" name="procdate" readonly required value="18 Jul 2026">
                </div>
              </div>
            </div>
            <div class="row">
              <div id="ptel-no" class="col-12 col-md-6 mb-2">
                <div class="form-floating">
                  <input class="form-control" type="tel" name="telno" pattern="[0]{1}[7]{1}[0-9]{8}" placeholder="" onblur="ptelNoVal()" required>
                  <label class="form-label" for="telno">Contact</label>
                </div>
              </div>
              <div class="col-12 col-md-6 mb-2">
                <div class="form-floating">
                  <input class="form-control" type="number" min="100" name="price" placeholder="" required>
                  <label class="form-label" for="price">Sell at (Ugx)</label>
                </div>
              </div>
            </div>
            <div class="d-grid gap-2 col-6 mx-auto">
              <button class="m-2 btn btn-success" type="submit">Save Details</button>
            </div>
          </form>
        </div>
      </div>
      <script src="/js/prodVal.js"></script>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  <footer>
    <div class="text-center text-white p-2 position-fixed bottom-0 end-0" style="background-color: rgba(0, 0, 0, 0.4);">KGL Ltd &copy; 2022 | Gertrude Nabasirye</div>
  </footer>
</body>
</html>
