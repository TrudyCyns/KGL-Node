<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="40x40" href="/images/favicon.png">
  <title>Edit Credit Sale | KGL</title>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <!-- BootStrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css">
  <!-- MDB -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/4.1.0/mdb.min.css" rel="stylesheet">
  <!-- Personal CSS -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Main Navigation -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
      <div class="container">
        <a class="navbar-brand mt-2 mt-lg-0" href="">
          <img src="/images/KGLogo.svg" alt="KGL Logo" loading="lazy" height="20">
        </a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/manager">Dashboard</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
          <a class="dropdown-item" href="/logout">Logout</a>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div class="container-lg">
      <!-- Flash messages (success_msg / error_msg / errors) render here when present -->
      <div class="row m-1">
        <h3 class="text-center">Edit Credit Sale</h3>
        <div class="card p-3">
          <form name="csales" action="/manager/creditsales/641f2a1b9e0a1b0012a3b460" method="POST" onsubmit="return credVal()">
            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <small id="errByrName"></small>
                <div class="form-floating">
                  <input class="form-control" type="text" name="byrname" required placeholder="" value="Moses Kirabo">
                  <label class="form-label" for="byrname">Buyer's Name</label>
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <small id="errLocation"></small>
                <div class="form-floating">
                  <input class="form-control" type="text" name="location" required placeholder="" value="Wakiso">
                  <label class="form-label" for="location">Location</label>
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <small id="errTelNo"></small>
                <div class="form-floating">
                  <input class="form-control" type="tel" pattern="[0]{1}[7]{1}[0-9]{8}" name="telno" placeholder="0701123456" value="0701123456" required>
                  <label class="form-label" for="telno">Buyer's Contact</label>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12 col-md-6 mb-2">
                <div class="form-floating">
                  <input class="form-control" type="number" min="10000" name="amtdue" value="6000000" required placeholder="">
                  <label class="form-label" for="amtdue">Amount Due (UGX)</label>
                </div>
              </div>
              <div class="col-12 col-md-6 mb-2">
                <div class="form-floating">
                  <input id="prodname" class="form-control" type="text" placeholder="" value="Beans" required>
                  <label class="form-label" for="prodname">Name of Produce</label>
                </div>
              </div>
            </div>
            <button class="btn btn-warning" type="submit">Save Changes</button>
          </form>
        </div>
      </div>
      <script src="/js/csaleVal.js"></script>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  <footer>
    <div class="text-center text-white p-2 position-fixed bottom-0 end-0" style="background-color: rgba(0, 0, 0, 0.4);">KGL Ltd &copy; 2022 | Gertrude Nabasirye</div>
  </footer>
</body>
</html>
