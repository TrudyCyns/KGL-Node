<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="40x40" href="/images/favicon.png">
  <title>KGL</title>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <!-- MDB -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/4.1.0/mdb.min.css" rel="stylesheet">
  <!-- Personal CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- JS -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/4.1.0/mdb.min.js"></script>
</head>
<body>
  <section class="bg">
    <div id="banner">
      <img src="./images/logo.svg" alt="KGL Logo" height="250px">
      <h3 style="color: #6a2510; font-weight: 900; font-size: 30px; padding: 20px;">
        Dealers in Beans, Grain Maize, Soy Beans, Cowpeas.
      </h3>
      <button class="btn btn-primary me-md-2 mb-2" data-mdb-toggle="modal" data-mdb-target="#newuser">
        Login
      </button>
    </div>
  </section>
  <!-- Login and Register Modal -->
  <div id="newuser" class="modal fade" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="exampleModalLabel" class="modal-title">Login</h5>
          <button class="btn-close" type="button" data-mdb-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Pills content -->
          <div class="tab-content">
            <div id="pills-login" class="tab-pane fade show active" role="tabpanel" aria-labelledby="tab-login">
              <form name="login" action="/" method="POST">
                <!-- Email input -->
                <div class="form-floating mb-3">
                  <input class="form-control" type="email" required placeholder="" name="email">
                  <label class="form-label" for="email">Email or username</label>
                </div>
                <!-- Password input -->
                <div class="form-floating mb-3">
                  <input class="form-control" type="password" required placeholder="" name="password">
                  <label class="form-label" for="password">Password</label>
                </div>
                <!-- Submit button -->
                <button class="btn btn-primary btn-block mb-3" type="submit">Login</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

  <footer>
    <div class="text-center text-white p-2 position-fixed bottom-0 end-0" style="background-color: rgba(0, 0, 0, 0.3);">KGL Ltd &copy; 2022 | Gertrude Nabasirye</div>
  </footer>
</body>
</html>
